version: '3.9'
services:
  server:
    build: ./server
    env_file:
      - ./server/.env
    ports:
      - "4000:4000"
    command: sh -c "npx prisma migrate deploy && node dist/index.js"
  client:
    build:
      context: ./client
      args:
        VITE_API_URL: http://localhost:4000/api
    depends_on:
      - server
    ports:
      - "5173:80"
